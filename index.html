<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغل متعدد الإطارات - تكرار تلقائي</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: Tahoma, Arial; background: #1e1e2f; padding: 20px; color: #fff; }
.toolbar {
background: #2d2d44; padding: 15px 20px; border-radius: 12px;
display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 25px;
}
.toolbar input, .toolbar select {
padding: 10px; border-radius: 8px; border: none; background: #3e3e5a; color: #fff;
}
.toolbar input { flex: 2; min-width: 180px; }
.toolbar input[type="number"] { flex: 0.5; min-width: 70px; width: 80px; }
.toolbar button {
padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
transition: 0.2s;
}
.toolbar button:hover { opacity: 0.8; transform: scale(0.97); }
.btn-add { background: #fd7e14; color: #fff; }
.btn-play { background: #198754; color: #fff; }
.btn-stop { background: #dc3545; color: #fff; }
.btn-play.active { background: #ffc107; color: #000; box-shadow: 0 0 15px #ffc107; }

.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
gap: 20px;
margin-top: 10px;
}

.frame-card {
background: #2a2a40; border-radius: 12px; padding: 12px;
box-shadow: 0 5px 15px rgba(0,0,0,0.5);
border: 2px solid transparent;
transition: 0.3s;
}
.frame-card:hover { border-color: #0d6efd; }
.frame-card .video-wrapper {
position: relative; padding-bottom: 56.25%; height: 0; background: #000;
border-radius: 8px; overflow: hidden;
}
.frame-card .video-wrapper iframe {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
}
.frame-card .frame-header {
display: flex; justify-content: space-between; align-items: center;
margin-top: 10px; padding: 5px 2px;
}
.frame-card .frame-header .title {
font-size: 14px; background: #3a3a55; padding: 4px 12px; border-radius: 20px;
white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
}
.frame-card .frame-header .views {
background: #444466; padding: 2px 12px; border-radius: 20px; font-size: 13px;
}
.frame-card .frame-actions {
display: flex; gap: 8px; margin-top: 8px;
}
.frame-card .frame-actions input {
flex: 1; padding: 8px; border-radius: 6px; border: none; background: #3e3e5a; color: #fff; font-size: 13px;
}
.frame-card .frame-actions button {
padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
}
.btn-del-frame { background: #dc3545; color: #fff; }
.btn-update-frame { background: #ffc107; color: #000; }
.empty-msg { grid-column: 1 / -1; text-align: center; padding: 60px; color: #888; font-size: 20px; }
.status-badge { background: #333; padding: 5px 15px; border-radius: 30px; font-size: 14px; }
.status-badge .on { color: #0f0; }
.status-badge .off { color: #f00; }
.loop-timer { background: #0d6efd; padding: 2px 12px; border-radius: 20px; font-size: 13px; }
</style>
</head>
<body>

<div class="toolbar">
<input type="text" id="newUrlInput" placeholder="الصق رابط يوتيوب / تيك توك / فيسبوك..." />
<button class="btn-add" onclick="addNewFrame()">➕ إضافة</button>

<input type="number" id="loopDuration" value="30" min="5" max="3600" />
<span style="font-size:13px;">ثانية للتكرار</span>

<button class="btn-play" id="loopToggleBtn" onclick="toggleLoop()">▶️ تشغيل الكل (تكرار تلقائي)</button>
<button class="btn-stop" onclick="stopAll()">⏹️ إيقاف الكل</button>

<span class="status-badge" id="loopStatus">
🔄 الحالة: <span class="off" id="loopStatusText">متوقف</span>
<span class="loop-timer" id="loopTimerDisplay">⏳ 0</span>
</span>
</div>

<div class="grid" id="framesGrid"></div>

<script>
// --- قاعدة البيانات ---
let frames = JSON.parse(localStorage.getItem('multiFrames')) || [];
let loopInterval = null;
let loopSeconds = 0;

// --- دالة تحويل الرابط مع خيارات التشغيل ---
function getEmbedUrl(url, autoplay = true) {
let muteParam = autoplay ? '&mute=1' : '';
let autoParam = autoplay ? '&autoplay=1' : '';

let match = url.match(/(?:youtube.com/watch?v=|youtu.be/)([^&?/]+)/);
if (match) return https://www.youtube.com/embed/${match[1]}?autoplay=${autoplay ? 1 : 0}&mute=${autoplay ? 1 : 0}&playsinline=1`;

match = url.match(/tiktok.com/@[\w]+/video/(\d+)/);
if (match) return https://www.tiktok.com/embed/v2/${match[1]}`;

if (url.includes('facebook.com') || url.includes('fb.com')) {
return https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&autoplay=${autoplay ? 1 : 0}&mute=${autoplay ? 1 : 0}`;
}

match = url.match(/vimeo.com/(\d+)/);
if (match) return https://player.vimeo.com/video/${match[1]}?autoplay=
{autoplay ? 1 : 0}`;

match = url.match(/dailymotion.com/video/([^_]+)/);
if (match) return https://www.dailymotion.com/embed/video/${match[1]}?autoplay=${autoplay ? 1 : 0};

return url;
}

// --- استخراج اسم مختصر ---
function getShortTitle(url) {
let m = url.match(/youtube.com/watch?v=([^&]+)/) || url.match(/youtu.be/([^?]+)/);
if (m) return '🎬 YT: ' + m[1].substring(0, 6);
m = url.match(/tiktok.com/@[\w]+/video/(\d+)/);
if (m) return '🎵 TT: ' + m[1];
m = url.match(/facebook.com/.*/videos/(\d+)/);
if (m) return '📘 FB: ' + m[1];
m = url.match(/vimeo.com/(\d+)/);
if (m) return '🎥 VM: ' + m[1];
return '📹 فيديو #' + (frames.length + 1);
}

// --- إضافة إطار جديد ---
function addNewFrame() {
const input = document.getElementById('newUrlInput');
let url = input.value.trim();
if (!url) return alert('الرجاء إدخال رابط الفيديو');
const newFrame = {
id: 'f_' + Date.now(),
url: url,
title: getShortTitle(url),
views: 0
};
frames.push(newFrame);
input.value = '';
saveAndRender();
}

// --- حذف إطار ---
function deleteFrame(id) {
if (!confirm('حذف هذا الإطار؟')) return;
frames = frames.filter(f => f.id !== id);
if (loopInterval) toggleLoop(); // إيقاف التكرار لو كان شغال
saveAndRender();
}

// --- تحديث رابط إطار ---
function updateFrame(id) {
const input = document.querySelector(input[data-id="${id}"]); const newUrl = input.value.trim(); if (!newUrl) return alert('الرجاء إدخال رابط صحيح'); const frame = frames.find(f =&gt; f.id === id); if (frame) { frame.url = newUrl; frame.title = getShortTitle(newUrl); if (loopInterval) { // لو كان التكرار شغال، نحدث الإطار فوراً const iframe = document.getElementById(iframe_${frame.id});
if (iframe) iframe.src = getEmbedUrl(newUrl, true);
}
saveAndRender();
}
}

// --- دالة التحديث التلقائي (تكرار التشغيل) ---
function reloadAllFrames() {
if (frames.length === 0) {
stopLoop();
return;
}

// 1. زيادة عدد المشاهدات لكل الإطارات
frames.forEach(frame => {
frame.views = (frame.views || 0) + 1;
});

// 2. تحديث مصدر جميع الإطارات مع تفعيل التشغيل التلقائي
frames.forEach(frame => {
const iframe = document.getElementById(iframe_${frame.id}`);
if (iframe) {
const embedUrl = getEmbedUrl(frame.url, true);
iframe.src = embedUrl;
}
});

// 3. حفظ وحساب الوقت المتبقي
saveAndRender();
loopSeconds = parseInt(document.getElementById('loopDuration').value) || 30;
document.getElementById('loopTimerDisplay').textContent = ⏳${loopSeconds}`;
}

// --- بدء حلقة التكرار ---
function startLoop() {
if (loopInterval) return;
if (frames.length === 0) return alert('أضف فيديوهات أولاً!');

// ننظف أي تشغيل سابق
stopAll();

// نحدد المدة
const duration = parseInt(document.getElementById('loopDuration').value) || 30;
if (duration < 3) return alert('المدة يجب أن تكون 3 ثواني على الأقل');

// نشغل أول مرة فوراً
reloadAllFrames();

// نبدأ المؤقت
loopInterval = setInterval(() => {
reloadAllFrames();
}, duration * 1000);

// تحديث واجهة الزر والحالة
const btn = document.getElementById('loopToggleBtn');
btn.textContent = '⏹️ إيقاف التكرار';
btn.classList.add('active');
document.getElementById('loopStatusText').textContent = 'يعمل 🔄';
document.getElementById('loopStatusText').className = 'on';
}

// --- إيقاف حلقة التكرار ---
function stopLoop() {
if (loopInterval) {
clearInterval(loopInterval);
loopInterval = null;
}
const btn = document.getElementById('loopToggleBtn');
btn.textContent = '▶️ تشغيل الكل (تكرار تلقائي)';
btn.classList.remove('active');
document.getElementById('loopStatusText').textContent = 'متوقف';
document.getElementById('loopStatusText').className = 'off';
document.getElementById('loopTimerDisplay').textContent = '⏳ 0';
}

// --- تبديل حالة التكرار (تشغيل/إيقاف) ---
function toggleLoop() {
if (loopInterval) {
stopLoop();
} else {
startLoop();
}
}

// --- إيقاف كل الإطارات (تفريغ الـ src) مع إيقاف التكرار ---
function stopAll() {
stopLoop();
frames.forEach(frame => {
const iframe = document.getElementById(iframe_${frame.id}`);
if (iframe) iframe.src = '';
});
}

// --- حفظ وعرض الشبكة ---
function saveAndRender() {
localStorage.setItem('multiFrames', JSON.stringify(frames));
const grid = document.getElementById('framesGrid');
grid.innerHTML = '';

if (frames.length === 0) {
grid.innerHTML = <div class="empty-msg"&gt;📭 لا توجد إطارات. أضف رابطاً في الأعلى&lt;/div>;
return;
}

frames.forEach(frame => {
const card = document.createElement('div');
card.className = 'frame-card';
const embedUrl = getEmbedUrl(frame.url, false); // بدون تشغيل تلقائي في البداية

card.innerHTML = &lt;div class="video-wrapper"&gt; &lt;iframe id="iframe_${frame.id}" src="

{frame.title}</span>
<span class="views">👁️ <span id="views_

{frame.views || 0}</span></span>
</div>
<div class="frame-actions">
<input type="text" data-id="

{frame.url}" />
<button class="btn-update-frame" onclick="updateFrame('

{frame.id}')">✖</button>
</div>
`;
grid.appendChild(card);
});
}

// --- عند تحميل الصفحة ---
window.onload = function() {
saveAndRender();
// لا نشغل تلقائياً، ننتظر المستخدم
};

// --- إضافة إطار بالضغط على Enter ---
document.getElementById('newUrlInput').addEventListener('keypress', function(e) {
if (e.key === 'Enter') addNewFrame();
});

// --- تحديث عداد الوقت الظاهر كل ثانية (للمتعة البصرية) ---
setInterval(() => {
if (loopInterval) {
if (loopSeconds > 0) {
loopSeconds--;
document.getElementById('loopTimerDisplay').textContent = ⏳ ${loopSeconds};
}
}
}, 1000);
</script>
</body>
</html>
