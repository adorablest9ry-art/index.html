<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغل متعدد - نسخة مصححة</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: Tahoma, Arial; background: #1e1e2f; padding: 20px; color: #fff; }
.toolbar { background: #2d2d44; padding: 15px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
.toolbar input { flex: 2; min-width: 150px; padding: 10px; border-radius: 8px; border: none; background: #3e3e5a; color: #fff; }
.toolbar input[type="number"] { flex: 0.5; min-width: 60px; width: 80px; }
.toolbar button { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.btn-add { background: #fd7e14; color: #fff; }
.btn-play { background: #198754; color: #fff; }
.btn-stop { background: #dc3545; color: #fff; }
.btn-play.active { background: #ffc107; color: #000; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 10px; }
.frame-card { background: #2a2a40; border-radius: 12px; padding: 12px; border: 2px solid transparent; }
.frame-card:hover { border-color: #0d6efd; }
.frame-card .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 8px; overflow: hidden; }
.frame-card .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.frame-header { display: flex; justify-content: space-between; margin-top: 8px; }
.frame-actions { display: flex; gap: 8px; margin-top: 8px; }
.frame-actions input { flex: 1; padding: 6px; border-radius: 6px; border: none; background: #3e3e5a; color: #fff; }
.empty-msg { grid-column: 1 / -1; text-align: center; padding: 60px; color: #888; }
.status-badge { background: #333; padding: 5px 15px; border-radius: 30px; font-size: 14px; }
</style>
</head>
<body>

<div class="toolbar">
<input type="text" id="newUrlInput" placeholder="الصق رابط يوتيوب أو تيك توك..." />
<button class="btn-add" onclick="addNewFrame()">➕ إضافة</button>
<input type="number" id="loopDuration" value="30" min="5" />
<button class="btn-play" id="loopToggleBtn" onclick="toggleLoop()">▶️ تشغيل تلقائي</button>
<button class="btn-stop" onclick="stopAll()">⏹️ إيقاف</button>
<span class="status-badge">🔄 <span id="loopStatusText">متوقف</span></span>
</div>

<div class="grid" id="framesGrid"></div>

<script>
// --- البيانات المخزنة ---
let frames = JSON.parse(localStorage.getItem('multiFrames')) || [];
let loopInterval = null;
let loopSeconds = 0;

// --- دالة تحويل الرابط (تم تبسيطها وإصلاحها) ---
function getEmbedUrl(url) {
if (!url) return '';
let u = url.trim();

// يوتيوب
let m = u.match(/(?:youtube.com/watch?v=|youtu.be/)([^&?/]+)/);
if (m) return https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&playsinline=1`;

// تيك توك
m = u.match(/tiktok.com/@[\w]+/video/(\d+)/);
if (m) return https://www.tiktok.com/embed/v2/${m[1]}`;

// فيسبوك
if (u.includes('facebook.com') || u.includes('fb.com')) {
return https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&autoplay=1&mute=1`;
}

// فيميو
m = u.match(/vimeo.com/(\d+)/);
if (m) return https://player.vimeo.com/video/${m[1]}?autoplay=1&muted=1`;

// لو ما عرفناها، نرجع الرابط نفسه (قد يكون رابط مباشر لـ MP4)
return u;
}

// --- دالة استخراج اسم مختصر (آمنة حتى لو الرابط غريب) ---
function getShortTitle(url) {
try {
let u = url || '';
if (u.includes('youtube')) return '🎬 يوتيوب';
if (u.includes('tiktok')) return '🎵 تيك توك';
if (u.includes('facebook')) return '📘 فيسبوك';
if (u.includes('vimeo')) return '🎥 فيميو';
return '📹 فيديو';
} catch(e) {
return '📹 فيديو';
}
}

// --- إضافة إطار جديد (تم تبسيطها وإضافة تنبيهات) ---
function addNewFrame() {
const input = document.getElementById('newUrlInput');
let url = input.value.trim();

if (!url) {
alert('⚠️ الرجاء إدخال رابط الفيديو أولاً!');
return;
}

// نضيف الفيديو للقائمة
const newFrame = {
id: 'f_' + Date.now(),
url: url,
title: getShortTitle(url),
views: 0
};
frames.push(newFrame);
input.value = ''; // ننظف الحقل

// نحفظ ونعرض
saveAndRender();

// لو كان أول فيديو، نبدأ التشغيل التلقائي فوراً (اختياري)
// لكن الأفضل نترك المستخدم يضغط على تشغيل
}

// --- حذف إطار ---
function deleteFrame(id) {
if (!confirm('حذف هذا الإطار؟')) return;
frames = frames.filter(f => f.id !== id);
if (loopInterval) toggleLoop();
saveAndRender();
}

// --- تحديث رابط ---
function updateFrame(id) {
const input = document.querySelector(input[data-id="${id}"]); const newUrl = input.value.trim(); if (!newUrl) return alert('الرجاء إدخال رابط'); const frame = frames.find(f =&gt; f.id === id); if (frame) { frame.url = newUrl; frame.title = getShortTitle(newUrl); saveAndRender(); // لو كان التكرار شغال، نحدث الإطار فوراً if (loopInterval) { const iframe = document.getElementById(iframe_${frame.id});
if (iframe) iframe.src = getEmbedUrl(newUrl);
}
}
}

// --- تشغيل جميع الإطارات معاً وزيادة المشاهدات ---
function reloadAllFrames() {
if (frames.length === 0) {
stopLoop();
return;
}

// زيادة المشاهدات لكل الإطارات
frames.forEach(frame => {
frame.views = (frame.views || 0) + 1;
});

// تحديث الـ iframes
frames.forEach(frame => {
const iframe = document.getElementById(iframe_${frame.id}`);
if (iframe) {
iframe.src = getEmbedUrl(frame.url);
}
});

// حفظ وحساب المدة المتبقية
saveAndRender();
loopSeconds = parseInt(document.getElementById('loopDuration').value) || 30;
document.getElementById('loopStatusText').textContent = يعمل (${loopSeconds}ث)`;
}

// --- بدء التكرار ---
function startLoop() {
if (loopInterval) return;
if (frames.length === 0) return alert('أضف فيديوهات أولاً!');

const duration = parseInt(document.getElementById('loopDuration').value) || 30;
if (duration < 3) return alert('المدة قصيرة جداً');

// نشغل أول مرة
reloadAllFrames();

// المؤقت
loopInterval = setInterval(() => {
reloadAllFrames();
}, duration * 1000);

document.getElementById('loopToggleBtn').textContent = '⏹️ إيقاف التكرار';
document.getElementById('loopToggleBtn').classList.add('active');
}

// --- إيقاف التكرار ---
function stopLoop() {
if (loopInterval) {
clearInterval(loopInterval);
loopInterval = null;
}
document.getElementById('loopToggleBtn').textContent = '▶️ تشغيل تلقائي';
document.getElementById('loopToggleBtn').classList.remove('active');
document.getElementById('loopStatusText').textContent = 'متوقف';
}

// --- تبديل ---
function toggleLoop() {
if (loopInterval) {
stopLoop();
} else {
startLoop();
}
}

// --- إيقاف الكل ---
function stopAll() {
stopLoop();
frames.forEach(frame => {
const iframe = document.getElementById(iframe_${frame.id}`);
if (iframe) iframe.src = '';
});
document.getElementById('loopStatusText').textContent = 'متوقف';
}

// --- حفظ وعرض الشبكة (هذا هو الجزء الأهم) ---
function saveAndRender() {
// حفظ في localStorage
localStorage.setItem('multiFrames', JSON.stringify(frames));

const grid = document.getElementById('framesGrid');
grid.innerHTML = '';

if (frames.length === 0) {
grid.innerHTML = <div class="empty-msg"&gt;📭 لا توجد إطارات. أضف رابطاً في الأعلى&lt;/div>;
return;
}

// إعادة بناء البطاقات
frames.forEach(frame => {
const card = document.createElement('div');
card.className = 'frame-card';

// نضع iframe بدون تشغيل تلقائي في البداية (لتوفير البيانات)
const embedSrc = getEmbedUrl(frame.url);

card.innerHTML = &lt;div class="video-wrapper"&gt; &lt;iframe id="iframe_${frame.id}" src="{frame.title}</span>
<span>👁️ <span id="views_{frame.views || 0}</span></span>
</div>
<div class="frame-actions">
<input type="text" data-id="{frame.url}" />
<button onclick="updateFrame('latex
{frame.id}')" style="background:#ffc107;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;"&gt;تحديث&lt;/button&gt; &lt;button onclick="deleteFrame('

{frame.id}')" style="background:#dc3545;color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;">✖</button>
</div>
`;
grid.appendChild(card);
});
}

// --- عند تحميل الصفحة ---
window.onload = function() {
saveAndRender();
// نعيد ضبط المؤقتات إذا كانت موجودة
stopLoop();
};

// --- إضافة بالضغط على Enter ---
document.getElementById('newUrlInput').addEventListener('keypress', function(e) {
if (e.key === 'Enter') addNewFrame();
});

// --- مؤقت للعد التنازلي البصري ---
setInterval(() => {
if (loopInterval) {
if (loopSeconds > 0) {
loopSeconds--;
document.getElementById('loopStatusText').textContent = يعمل (${loopSeconds}ث);
}
}
}, 1000);
</script>
</body>
</html>
